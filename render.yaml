services:
  - type: web
    name: skyhighevs
    runtime: docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: TOTP_SECRET
        sync: false
      - key: WORKER_API_KEY
        sync: false
