name: Build launcher.exe

on:
  push:
    paths:
      - 'launcher.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests colorama

      - name: Build launcher.exe
        run: |
          pyinstaller --onefile --name launcher --console launcher.py

      - name: Upload launcher.exe
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: dist/launcher.exe
          retention-days: 30
