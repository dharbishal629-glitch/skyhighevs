services:
  - type: web
    name: api-server
    env: node
    buildCommand: |
      npm install -g pnpm &&
      pnpm install --frozen-lockfile &&
      cd artifacts/dashboard && pnpm run build &&
      cd ../api-server && pnpm run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
